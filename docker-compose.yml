# 本機開發：docker compose up -d  （不需任何雲端金鑰；AI 走 mock provider）
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: interiorai }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    # minio/minio 與 quay.io/minio/minio 已無法匿名拉取（ADR-018）；開發/測試改用凍結的 bitnamilegacy 映像
    image: bitnamilegacy/minio:latest
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345, MINIO_DEFAULT_BUCKETS: interiorai }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/bitnami/minio/data]
  cv-service:
    build: ./services/cv-service
    ports: ["8100:8100"]
    profiles: ["cv"]
volumes: { pgdata: {}, miniodata: {} }
