# 複製到 .github/workflows/ci.yml（bootstrap 會自動複製）
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: interiorai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/interiorai
      REDIS_URL: redis://localhost:6379
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test            # 單元（含 core-geometry property tests）
      - run: pnpm build
      - run: pnpm coverage        # core-geometry 分支覆蓋 ≥90%（P1 Gate）
      - run: pip install jsonschema && python3 tools/validate_scene.py fixtures/scenes/sample-scene.json
      # P2 起：
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e        # 使用 mock AI
      - run: pnpm licenses:check  # 依賴與資產授權掃描
      # P3 起（實作後取消註解）：
      # - run: pnpm test:integration
      # - run: pnpm test:contract   # OpenAPI 與實作一致
      # P7 起：
      # - run: pnpm size            # bundle 大小預算
      - run: pnpm audit --prod
      - run: python3 tools/check_models.py services/api/models.yaml   # 未驗證只提示；超過 30 天未核對會失敗
  python:
    # P5 建立 services/cv-service 後才會實際執行（hashFiles 只能用在 step 層級）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "cv=$([ -f services/cv-service/requirements.txt ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.cv == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: steps.has.outputs.cv == '1'
        working-directory: services/cv-service
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          ruff check .
          pytest -q
